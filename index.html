<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>Projeto no ar</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #111827; color: #f9fafb; }
      main { max-width: 640px; text-align: center; }
      h1 { margin-bottom: 12px; font-size: clamp(2rem, 7vw, 3.5rem); }
      p { color: #cbd5e1; line-height: 1.7; }
      .badge { display: inline-block; padding: 6px 12px; border: 1px solid #334155; border-radius: 999px; color: #a7f3d0; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Deploy pronto</span>
      <h1>Projeto publicado com sucesso</h1>
      <p>Esta página inicial simples permite importar e publicar o repositório na Vercel. Você pode substituí-la pelo conteúdo do seu projeto quando estiver pronto.</p>
    </main>
  </body>
</html>
